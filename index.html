<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>POS Multi-Store</title>

<!-- PWA: installable, opens in standalone (app-like) mode -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B7FD6">
<meta name="background-color" content="#ffffff">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POS Store">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= PAGE A: PROFILE + STORE PICKER ================= -->
<section id="page-login" class="page active">
  <div class="profile-card">
    <div class="avatar" id="profile-avatar" title="แตะเพื่อเปลี่ยนรูปโปรไฟล์">
      <span class="avatar-edit-badge">📷</span>
    </div>
    <input id="input-avatar-existing" type="file" accept="image/*" hidden>
    <div class="profile-info">
      <div><span class="label">User ID :</span></div>
      <div><span class="label">Name :</span> <span id="profile-name">-</span></div>
      <div><span class="label">Permission :</span> <span id="profile-permission">-</span></div>
    </div>
  </div>
  <div class="divider"></div>

  <div class="store-grid" id="store-grid">
    <!-- store tiles injected by app.js -->
  </div>

  <div class="footer-credit">
    Credits : Open Source UI Web app<br>Napat
  </div>
</section>

<!-- ================= PAGE B: ORDER ENTRY ================= -->
<section id="page-order" class="page">
  <header class="order-header">
    <button id="btn-back" class="btn-back">←</button>
    <div class="order-store-name" id="order-store-name">ร้านค้า</div>
    <div class="order-user-name" id="order-user-name"></div>
  </header>

  <div class="product-grid" id="product-grid">
    <!-- product tiles injected by app.js -->
  </div>

  <div class="summary-panel">
    <div class="summary-title">สรุปรายการสินค้า</div>
    <div id="summary-lines" class="summary-lines">
      <div class="summary-empty">ยังไม่ได้เลือกสินค้า</div>
    </div>
    <div class="summary-total">
      รวม <span id="summary-total">0</span> บาท
    </div>
  </div>

  <button id="btn-save-order" class="btn-save">บันทึกส่งออเดอร์</button>
</section>

<!-- ================= MODAL: PICK COURIER ================= -->
<div id="modal-courier" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">เลือกผู้จัดส่ง</div>
    <div id="courier-options" class="courier-options"></div>
    <button id="btn-cancel-courier" class="btn-cancel">ยกเลิก</button>
  </div>
</div>

<!-- ================= MODAL: NEW USER NAME ================= -->
<div id="modal-newuser" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">ยินดีต้อนรับ</div>
    <div class="modal-sub">กรอกชื่อของคุณเพื่อเริ่มใช้งาน</div>

    <div class="avatar-picker" id="avatar-picker-new">
      <div class="avatar" id="new-avatar-preview">
        <span class="avatar-edit-badge">📷</span>
      </div>
      <div class="avatar-picker-hint">แตะเพื่อเลือกรูปโปรไฟล์ (ไม่บังคับ)</div>
    </div>
    <input id="input-avatar-new" type="file" accept="image/*" hidden>

    <input id="input-username" class="text-input" type="text" placeholder="ชื่อของคุณ">
    <button id="btn-confirm-name" class="btn-save">เริ่มใช้งาน</button>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
